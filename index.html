<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital IC Trainer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div style="display: flex; flex: 1; overflow: hidden;">
    <aside class="sidebar">
        <h2>Component Tray</h2>
        <p class="hint">Drag IC to slot.<br><strong>Double-click IC/wire to remove.</strong></p>
        
        <div class="ic-palette">
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="7408">7408 &nbsp;—&nbsp; AND</div>
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="7432">7432 &nbsp;—&nbsp; OR</div>
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="7404">7404 &nbsp;—&nbsp; NOT</div>
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="7400">7400 &nbsp;—&nbsp; NAND</div>
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="7402">7402 &nbsp;—&nbsp; NOR</div>
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="7486">7486 &nbsp;—&nbsp; XOR</div>
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="74266">74266 — XNOR</div>
            <div class="ic-drag" draggable="true" ondragstart="dragIC(event)" data-type="7474">7474 &nbsp;—&nbsp;D Flip-Flop</div>
        </div>

        <div class="controls">
            <button id="saveProjectBtn" class="btn" style="background: #2c3e50; color: #fff; margin-bottom: 5px;">💾 Save Project</button>
            <select id="loadProjectSelect" class="btn" style="margin-bottom: 10px; background: var(--bg);">
                <option value="">-- Load Project --</option>
            </select>
            <button id="netlistBtn" class="btn" style="background: var(--accent); color: #111; font-weight: bold; margin-bottom: 5px;">🔌 Connection List</button>
            <button id="toggleWiresBtn" class="btn">Hide Wires</button>
            <button id="clearWiresBtn" class="btn danger">Clear All Wires</button>
        </div>
    </aside>

    <div class="main-area" id="canvas">
        <div class="ai-bar">
            <input type="text" id="targetExpr" placeholder="e.g., Y = AB + C">
            <button id="checkCircuitBtn">Check Wiring</button>
        </div>

        <svg id="wireLayer"></svg>
        <div class="slots-container">
            <div class="ic-slot" ondrop="dropIC(event)" ondragover="allowDrop(event)" data-slot="1"><span class="slot-text">Slot 1</span></div>
            <div class="ic-slot" ondrop="dropIC(event)" ondragover="allowDrop(event)" data-slot="2"><span class="slot-text">Slot 2</span></div>
            <div class="ic-slot" ondrop="dropIC(event)" ondragover="allowDrop(event)" data-slot="3"><span class="slot-text">Slot 3</span></div>
            <div class="ic-slot" ondrop="dropIC(event)" ondragover="allowDrop(event)" data-slot="4"><span class="slot-text">Slot 4</span></div>
            <div class="ic-slot" ondrop="dropIC(event)" ondragover="allowDrop(event)" data-slot="5"><span class="slot-text">Slot 5</span></div>
            <div class="ic-slot" ondrop="dropIC(event)" ondragover="allowDrop(event)" data-slot="6"><span class="slot-text">Slot 6</span></div>
        </div>
    </div>
</div>

<div class="io-container">
    <div class="io-section"><h3>INPUT SWITCHES</h3><div class="io-row" id="inputRow"></div></div>
    <div class="io-section"><h3>OUTPUT LEDs</h3><div class="io-row" id="outputRow"></div></div>
</div>

<div id="aiModal" class="ai-modal">
    <div class="ai-modal-content">
        <button class="close-btn" onclick="document.getElementById('aiModal').style.display='none'">✕</button>
        <h3 id="aiModalTitle">Analyzing...</h3>
        <div id="aiModalBody"></div>
        <button class="bottom-btn" onclick="document.getElementById('aiModal').style.display='none'">Close</button>
    </div>
</div>

<div id="ttModal" class="ai-modal">
    <div class="ai-modal-content" style="max-width: 500px; max-height: 80vh; display: flex; flex-direction: column;">
        <button class="close-btn" onclick="document.getElementById('ttModal').style.display='none'">✕</button>
        <h3 id="ttModalTitle" style="color: var(--accent);">Connection List</h3>
        <div id="ttModalBody" style="overflow-y: auto; margin-top: 10px; flex: 1; padding-right: 5px;"></div>
        <button class="bottom-btn" onclick="document.getElementById('ttModal').style.display='none'">Close</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
